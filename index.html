<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SearchX</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff00aa;
            --neon-purple: #b300ff;
            --neon-green: #39ff14;
            --neon-yellow: #fff200;
            --dark-bg: #050510;
            --panel-bg: rgba(10, 10, 30, 0.85);
            --panel-border: rgba(0, 240, 255, 0.15);
            --text-primary: #e0e8ff;
            --text-dim: #5a6080;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* === Animated background grid === */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            animation: gridScroll 20s linear infinite;
        }

        @keyframes gridScroll {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* === Glowing orbs === */
        body::after {
            content: '';
            position: fixed;
            top: -200px; right: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(179,0,255,0.08) 0%, transparent 70%);
            z-index: 0;
            animation: orbFloat 15s ease-in-out infinite alternate;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-100px, 200px) scale(1.3); }
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* === Home layout === */
        .home {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            transition: all 0.5s ease;
        }

        .home.has-results {
            min-height: auto;
            padding-top: 30px;
        }

        /* === Logo === */
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 10px;
            position: relative;
            color: var(--neon-cyan);
            text-shadow:
                0 0 10px rgba(0,240,255,0.5),
                0 0 40px rgba(0,240,255,0.3),
                0 0 80px rgba(0,240,255,0.15);
            animation: logoGlow 3s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            0% { text-shadow: 0 0 10px rgba(0,240,255,0.5), 0 0 40px rgba(0,240,255,0.3), 0 0 80px rgba(0,240,255,0.15); }
            100% { text-shadow: 0 0 15px rgba(0,240,255,0.7), 0 0 50px rgba(179,0,255,0.4), 0 0 100px rgba(255,0,170,0.2); }
        }

        .logo-sub {
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 40px;
            text-align: center;
        }

        .home.has-results .logo { font-size: 28px; margin-bottom: 4px; letter-spacing: 2px; }
        .home.has-results .logo-sub { font-size: 10px; margin-bottom: 20px; letter-spacing: 4px; }

        /* === Search bar === */
        .search-bar {
            display: flex;
            width: 100%;
            max-width: 640px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .search-bar::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            right: -1px; bottom: -1px;
            border-radius: 4px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-magenta));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .search-bar:focus-within::before { opacity: 1; }
        .search-bar:focus-within { border-color: transparent; }

        .search-bar input {
            flex: 1;
            padding: 16px 22px;
            font-size: 16px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
            background: transparent;
            border: none;
            color: var(--text-primary);
            outline: none;
            letter-spacing: 0.5px;
        }

        .search-bar input::placeholder {
            color: var(--text-dim);
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
        }

        .search-bar button {
            padding: 16px 24px;
            background: transparent;
            border: none;
            color: var(--neon-cyan);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .search-bar button:hover {
            color: var(--neon-magenta);
            text-shadow: 0 0 15px rgba(255,0,170,0.5);
        }

        /* === Engine selector === */
        .options {
            display: flex;
            gap: 8px;
            margin-top: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .engine-btn {
            padding: 6px 16px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 2px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .engine-btn:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .engine-btn.active {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1), inset 0 0 10px rgba(0, 240, 255, 0.05);
        }

        /* === Region selector === */
        .region-bar {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            align-items: center;
            justify-content: center;
        }

        .region-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 4px;
        }

        .region-btn {
            padding: 4px 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            background: var(--panel-bg);
            border: 1px solid rgba(57, 255, 20, 0.12);
            border-radius: 2px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .region-btn:hover {
            border-color: var(--neon-green);
            color: var(--neon-green);
        }

        .region-btn.active {
            border-color: var(--neon-green);
            color: var(--neon-green);
            background: rgba(57, 255, 20, 0.05);
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.1), inset 0 0 8px rgba(57, 255, 20, 0.05);
        }

        /* === Results === */
        .results {
            margin-top: 30px;
            width: 100%;
            max-width: 640px;
        }

        .result {
            padding: 18px;
            margin-bottom: 8px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-left: 2px solid var(--neon-cyan);
            border-radius: 2px;
            transition: all 0.2s;
            position: relative;
        }

        .result:hover {
            border-left-color: var(--neon-magenta);
            background: rgba(10, 10, 40, 0.9);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.05);
        }

        .result:hover .result-title { color: var(--neon-magenta); }

        .result a { text-decoration: none; }

        .result-domain {
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--neon-green);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.7;
        }

        .result-domain img {
            width: 14px; height: 14px;
            border-radius: 1px;
            filter: brightness(0.9);
        }

        .result-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 19px;
            font-weight: 600;
            color: var(--neon-cyan);
            margin-bottom: 6px;
            line-height: 1.3;
            transition: color 0.2s;
        }

        .result-snippet {
            font-size: 14px;
            font-weight: 400;
            color: #8888aa;
            line-height: 1.6;
        }

        .result-index {
            position: absolute;
            top: 8px;
            right: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            color: rgba(0, 240, 255, 0.15);
        }

        /* === Status / Loading === */
        .status {
            text-align: center;
            padding: 50px;
            color: var(--text-dim);
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
        }

        .cyber-loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            position: relative;
            margin-bottom: 15px;
        }

        .cyber-loader::before, .cyber-loader::after {
            content: '';
            position: absolute;
            border: 2px solid transparent;
            border-radius: 50%;
        }

        .cyber-loader::before {
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-top-color: var(--neon-cyan);
            border-right-color: var(--neon-cyan);
            animation: spin 0.8s linear infinite;
        }

        .cyber-loader::after {
            top: 6px; left: 6px;
            width: calc(100% - 12px);
            height: calc(100% - 12px);
            border-bottom-color: var(--neon-magenta);
            border-left-color: var(--neon-magenta);
            animation: spin 1.2s linear infinite reverse;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error { color: #ff3355; }

        .meta {
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 20px;
            padding: 8px 0;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .engine-tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 2px;
            font-size: 10px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(0, 240, 255, 0.08);
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        /* === Scan line effect === */
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.03) 0px,
                rgba(0, 0, 0, 0.03) 1px,
                transparent 1px,
                transparent 3px
            );
        }

        /* === Scrollbar === */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.2); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 240, 255, 0.4); }

        /* === Responsive === */
        @media (max-width: 600px) {
            .logo { font-size: 40px; letter-spacing: 2px; }
            .home.has-results .logo { font-size: 22px; }
            .result { padding: 14px; }
            .result-title { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <div class="container">
        <div class="home" id="home">
            <div class="logo">SEARCH X</div>
            <div class="logo-sub">neural search interface</div>

            <div class="search-bar">
                <input type="text" id="query" placeholder="> enter_query..." autofocus>
                <button onclick="doSearch()">&#9655;</button>
            </div>

            <div class="options">
                <button class="engine-btn active" data-engine="google">Google</button>
                <button class="engine-btn" data-engine="yandex">Yandex</button>
                <button class="engine-btn" data-engine="all">All</button>
            </div>

            <div class="region-bar">
                <span class="region-label">proxy</span>
                <button class="region-btn active" data-region="kz">KZ</button>
                <button class="region-btn" data-region="ru">RU</button>
                <button class="region-btn" data-region="global">Global</button>
            </div>

            <div id="output" class="results"></div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        let currentEngine = 'google';
        let currentRegion = 'kz';

        // Engine selector
        document.querySelectorAll('.engine-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.engine-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentEngine = btn.dataset.engine;
            });
        });

        // Region selector
        document.querySelectorAll('.region-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentRegion = btn.dataset.region;
            });
        });

        $('query').addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
        });

        async function doSearch() {
            const q = $('query').value.trim();
            if (!q) return;

            const home = $('home');
            const out = $('output');
            home.classList.add('has-results');
            out.innerHTML = '<div class="status"><div class="cyber-loader"></div><br>SCANNING NETWORK...</div>';

            const params = new URLSearchParams({ q, engine_name: currentEngine, num: 15, region: currentRegion });

            try {
                const t0 = performance.now();
                const res = await fetch('/api/search?' + params);
                const data = await res.json();
                const elapsed = ((performance.now() - t0) / 1000).toFixed(2);

                if (data.error) {
                    out.innerHTML = '<div class="status error">ERR: ' + esc(data.error) + '</div>';
                    return;
                }

                if (!data.results || data.results.length === 0) {
                    out.innerHTML = '<div class="status">NO_RESULTS_FOUND</div>';
                    return;
                }

                let html = '<div class="meta"><span>' + data.count + ' nodes found // ' + elapsed + 's</span>'
                    + '<span class="engine-tag">' + esc(data.engine) + '</span>'
                    + '<span class="engine-tag" style="border-color:rgba(57,255,20,0.3);color:var(--neon-green);background:rgba(57,255,20,0.05)">' + esc(data.region || currentRegion).toUpperCase() + '</span></div>';

                data.results.forEach((r, i) => {
                    const favicon = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(r.domain) + '&sz=32';
                    html += '<div class="result" style="animation: fadeIn 0.3s ease ' + (i * 0.05) + 's both">';
                    html += '<span class="result-index">' + String(i + 1).padStart(2, '0') + '</span>';
                    html += '<a href="' + esc(r.url) + '" target="_blank">';
                    html += '<div class="result-domain"><img src="' + favicon + '" alt="">' + esc(r.domain) + '</div>';
                    html += '<div class="result-title">' + esc(r.title) + '</div>';
                    html += '</a>';
                    if (r.snippet) html += '<div class="result-snippet">' + esc(r.snippet) + '</div>';
                    html += '</div>';
                });

                out.innerHTML = html;
            } catch (e) {
                out.innerHTML = '<div class="status error">CONNECTION_FAILED: ' + esc(e.message) + '</div>';
            }
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }
    </script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
